id = "bantay-tui.integration"
name = "Bantay-TUI Integration"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Native SwiftUI agent-status display in macOS notch, reading Herdr lifecycle events."
platforms = ["macos"]

[[actions]]
id = "setup"
title = "Bantay-TUI: install agent event adapter"
contexts = ["workspace"]
command = ["sh", "scripts/setup.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "scripts/event-adapter.mjs"]
