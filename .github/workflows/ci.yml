name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Layer 1 · Format
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: swift format lint
        run: swift format lint --recursive --strict Sources Tests

  build:
    name: Layer 2 · Compile
    needs: format
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: swift build
        run: swift build

  test:
    name: Layer 3 · Tests
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: swift test
        run: swift test

  logic:
    name: Layer 3.5 · Logic checks
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: swiftc logic harness
        run: |
          swiftc -o /tmp/logic-check \
            Sources/BantayTUI/AgentEventKind.swift \
            Sources/BantayTUI/AgentDetector.swift \
            Sources/BantayTUI/NotchHUDConfig.swift \
            Sources/BantayTUI/HerdrSocketAdapter.swift \
            Sources/BantayTUI/IslandMetrics.swift \
            Sources/BantayTUI/PlexerAdapter.swift \
            Sources/BantayTUI/AgentEventManager.swift \
            Sources/BantayTUI/UsageTracker.swift \
            Sources/BantayTUI/EventIngestServer.swift \
            Sources/BantayTUI/ShelfModel.swift \
            Sources/BantayTUI/TerminalFocusser.swift \
            Sources/BantayTUI/LaunchAgent.swift \
            .kilo/LogicCheck.swift
          /tmp/logic-check

  release:
    name: Layer 4 · Release
    needs: test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: swift build -c release
        run: swift build -c release

  secrets:
    name: Layer 5 · Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pins:
    name: Layer 5 · Pinned actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: zgosalvez/github-actions-ensure-sha-pinned-actions@3db98c0363e2fa5df3e1c4c471777a7c10b24cc9 # v5.0.5
