name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Fast path (macOS 15, Apple Silicon) — the required merge gate.
  # ------------------------------------------------------------------
  format:
    name: Layer 1 · Format
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: swift format lint
        run: swift format lint --recursive --strict Sources Tests

  build:
    name: Layer 2 · Compile
    needs: format
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: swift build
        run: swift build

  test:
    name: Layer 3 · Tests
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: swift test
        run: swift test

  logic:
    name: Layer 3.5 · Logic checks
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: swiftc logic harness
        run: |
          swiftc -o /tmp/logic-check \
            Sources/BantayTUI/AgentEventKind.swift \
            Sources/BantayTUI/AgentDetector.swift \
            Sources/BantayTUI/ClaudeHookInstaller.swift \
            Sources/BantayTUI/NotchHUDConfig.swift \
            Sources/BantayTUI/HerdrSocketAdapter.swift \
            Sources/BantayTUI/HerdrSocketClient.swift \
            Sources/BantayTUI/IslandMetrics.swift \
            Sources/BantayTUI/PlexerAdapter.swift \
            Sources/BantayTUI/AgentEventManager.swift \
            Sources/BantayTUI/UsageTracker.swift \
            Sources/BantayTUI/EventIngestServer.swift \
            Sources/BantayTUI/ShelfModel.swift Sources/BantayTUI/HerdrPluginInstaller.swift \
            Sources/BantayTUI/TerminalFocusser.swift \
            Sources/BantayTUI/LaunchAgent.swift \
            .kilo/LogicCheck.swift
          /tmp/logic-check

  smoke:
    name: Layer 4.5 · Launch smoke
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: swift build
        run: swift build
      - name: Launch app for 10s
        run: |
          ./.build/debug/bantay 2>/tmp/bantay-smoke.err & PID=$!
          sleep 10
          if ! kill -0 $PID 2>/dev/null; then
            echo "app exited early (startup crash?)"
            cat /tmp/bantay-smoke.err
            exit 1
          fi
          kill $PID
          sleep 1
          if kill -0 $PID 2>/dev/null; then kill -9 $PID; fi
          echo "app stayed alive 10s — ok"

  release:
    name: Layer 4 · Release
    needs: test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: swift build -c release
        run: swift build -c release

  # ------------------------------------------------------------------
  # Legacy path (macOS 13, Intel) — best-effort parallel validation of
  # the macOS 13 floor. Intel runners are queue-starved on GitHub, so
  # this chain never blocks the fast path above; it still reports as a
  # required check when it eventually runs.
  # ------------------------------------------------------------------
  build13:
    name: Layer 2 · Compile (macOS 13/Intel)
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: swift build
        run: swift build

  test13:
    name: Layer 3 · Tests (macOS 13/Intel)
    needs: build13
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: swift test
        run: swift test

  logic13:
    name: Layer 3.5 · Logic checks (macOS 13/Intel)
    needs: build13
    runs-on: macos-13
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: swiftc logic harness
        run: |
          swiftc -o /tmp/logic-check \
            Sources/BantayTUI/AgentEventKind.swift \
            Sources/BantayTUI/AgentDetector.swift \
            Sources/BantayTUI/ClaudeHookInstaller.swift \
            Sources/BantayTUI/NotchHUDConfig.swift \
            Sources/BantayTUI/HerdrSocketAdapter.swift \
            Sources/BantayTUI/HerdrSocketClient.swift \
            Sources/BantayTUI/IslandMetrics.swift \
            Sources/BantayTUI/PlexerAdapter.swift \
            Sources/BantayTUI/AgentEventManager.swift \
            Sources/BantayTUI/UsageTracker.swift \
            Sources/BantayTUI/EventIngestServer.swift \
            Sources/BantayTUI/ShelfModel.swift Sources/BantayTUI/HerdrPluginInstaller.swift \
            Sources/BantayTUI/TerminalFocusser.swift \
            Sources/BantayTUI/LaunchAgent.swift \
            .kilo/LogicCheck.swift
          /tmp/logic-check

  # ------------------------------------------------------------------
  # Static gates (ubuntu, independent).
  # ------------------------------------------------------------------
  secrets:
    name: Layer 5 · Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pins:
    name: Layer 5 · Pinned actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: zgosalvez/github-actions-ensure-sha-pinned-actions@3db98c0363e2fa5df3e1c4c471777a7c10b24cc9 # v5.0.5
