name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  universal-package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build and stage universal2 app
        run: scripts/setup.sh --package
        env:
          # Developer ID signing: export your cert (Keychain Access ->
          # right-click cert -> Export... p12) as base64 into this secret,
          # plus the p12 password. Without them the app is ad-hoc signed and
          # Gatekeeper will warn on other Macs.
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          # Notarization: create a notarytool keychain profile on a Mac:
          #   xcrun notarytool store-credentials bantay \
          #     --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
          #     --password "$APP_PASSWORD"
          # then expose the same credentials here (or APPLE_ID/TEAM_ID/
          # APP_PASSWORD individually). Skipped when unset.
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/bantay-tui.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bantay-TUI $GITHUB_REF_NAME" \
            --notes "Universal2 (Apple Silicon + Intel) app bundle. SHA256: $(shasum -a 256 dist/bantay-tui.zip | awk '{print $1}')"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish updated cask via PR
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SHA="$(shasum -a 256 dist/bantay-tui.zip | awk '{print $1}')"
          VERSION="${GITHUB_REF_NAME#v}"
          # Match either the placeholder ("REPLACE_WITH_ZIP_SHA256") or an
          # existing 64-hex sha, and always sync version from the tag so the
          # cask URL (v#{version}) and checksum never drift from the release.
          sed -i '' -E "s/sha256 \".*\"/sha256 \"$SHA\"/" Cask/bantay-tui.rb
          sed -i '' -E "s/version \".*\"/version \"$VERSION\"/" Cask/bantay-tui.rb
          if git diff --quiet Cask/bantay-tui.rb; then
            echo "cask already up to date; nothing to commit"
            exit 0
          fi
          BRANCH="release/cask-v$VERSION"
          git config user.name "bantay-tui bot"
          git config user.email "bot@bantay-tui.invalid"
          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
          git add Cask/bantay-tui.rb
          git commit -m "release: update cask to v$VERSION (sha256 $SHA)"
          git push origin "$BRANCH" 2>/dev/null || git push -f origin "$BRANCH"
          # main is PR-protected, so the cask update lands as a PR that the
          # maintainer merges; CI runs the normal gates on it.
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "release: cask update for v$VERSION" \
            --body "Automated by the release workflow for tag $GITHUB_REF_NAME.

            - version: $VERSION
            - sha256: $SHA" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.7.0
        with:
          name: bantay-tui
          path: dist/bantay-tui.zip
